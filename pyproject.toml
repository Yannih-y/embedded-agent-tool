[project]
name = "agent-memory-pool"
version = "0.3.0"
description = "多Agent共享内存池：打通不同厂家AI交互壁垒，独立服务进程 + 分层记忆"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.15"
dependencies = [
    "mem0ai==2.0.13",
    "fastapi>=0.116.2,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "pydantic>=2.10.5,!=2.12.*,!=2.13.*,!=2.14.0,!=2.14.1,<3",
    "httpx>=0.28.0",
    "fastembed>=0.8.0",
    "anthropic>=0.119.0",
    "mcp>=1.22.0",
    "faiss-cpu>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[project.scripts]
mempool-server = "memorypool.server:main"
mempool-daemon = "memorypool.daemon:main"
mempool-mcp = "memorypool.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memorypool"]
